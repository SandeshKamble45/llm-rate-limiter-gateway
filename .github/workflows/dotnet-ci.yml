name: .NET 10 CI

on:
  push:
    branches:
      - migration/dotnet10-azure
  pull_request:
    branches:
      - main
      - migration/dotnet10-azure

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LlmGateway.sln

      - name: Build
        run: dotnet build LlmGateway.sln --configuration Release --no-restore

      - name: Test (Microsoft Testing Platform)
        run: dotnet test LlmGateway.sln --configuration Release --no-build --max-parallel-test-modules 2 --report-trx --results-directory TestResults

      - name: Build container image
        run: docker build --tag llm-gateway-dotnet:ci .

      - name: Validate Azure Bicep templates
        run: |
          az bicep install
          az bicep build --file infrastructure/azure/foundation.bicep --outfile /tmp/foundation.json
          az bicep build --file infrastructure/azure/main.bicep --outfile /tmp/main.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet/TestResults/**/*.trx
          if-no-files-found: warn
